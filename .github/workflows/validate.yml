name: Validate
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component "adb-shell[async]>=0.4.4" mypy pytest-cov
      - name: Strict typing
        run: mypy
      - name: Tests (>=95% coverage)
        run: pytest -q --ignore=tests/live --cov --cov-fail-under=95
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Reproducible build matches bundled binary
        run: daemon/build.sh --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thermostat_api-linux-build
          path: daemon/build/thermostat_api
