name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: 1.1.2
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Device page → **Collect debug report** (optional, adds build details), then ⋮ → **Download diagnostics**,
        right after the problem (the thermostat's own log only keeps a few minutes). Attach the file here.
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: "With `custom_components.aciq_thermostat: debug` logging enabled."
      render: text
