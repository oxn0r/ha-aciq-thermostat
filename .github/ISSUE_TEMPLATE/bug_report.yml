name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Device page → ⋮ → Download diagnostics, then attach or paste here.
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: "With `custom_components.aciq_thermostat: debug` logging enabled."
      render: text
